<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXUS Messenger</title><link rel="stylesheet" href="style.css"></head><body>
<div id="auth" class="auth"><section class="authbox"><h1>NEXUS <i>●</i></h1><p>Мессенджер для своих</p><input id="username" placeholder="Имя пользователя" autocomplete="username"><input id="password" type="password" placeholder="Пароль (от 8 символов)" autocomplete="current-password"><div class="actions"><button id="login">Войти</button><button id="register" class="secondary">Создать аккаунт</button></div><small id="authmsg"></small></section></div>
<div id="app" class="layout hidden"><aside class="rail"><div class="mark">N</div><div class="bubble">✦</div><div class="bubble">＋</div></aside><aside class="side"><h2>NEXUS</h2><div class="muted">ЛИЧНЫЕ ЧАТЫ</div><div class="searchrow"><input id="search" placeholder="Найти пользователя"><button id="find">Найти</button></div><div id="results"></div><div class="muted">ЧАТЫ</div><div id="chats"></div><div class="me"><span class="avatar">●</span><span id="myname"></span><button id="logout">Выйти</button></div></aside><main class="chat"><header><b id="roomtitle"># Общий чат</b><span>Онлайн-чат</span></header><div id="messages" class="messages"></div><form id="sendform" class="composer"><input id="body" maxlength="2000" placeholder="Написать сообщение…" autocomplete="off"><button>Отправить</button></form></main></div><script src="/socket.io/socket.io.js"></script><script src="app.js"></script></body></html>
